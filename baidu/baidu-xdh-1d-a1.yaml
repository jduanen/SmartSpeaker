# Baidu Xiaodu XDH-1D-A1 as an ESPHome host-platform device.
# One file per speaker: set mac to the unit's WiFi MAC (adb shell ifconfig wlan0).
# SPIKE: 4A:... is the real 48:... with the locally-administered bit set, so HA
# treats it as a new device and leaves the C++ app's xiaodu-1486a2 entry alone.
substitutions:
  mac: "4A:F3:F3:14:86:A2"
  mac_suffix: "1486a2"
  name: baidu-${mac_suffix}
  friendly_name: Baidu ${mac_suffix}

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: spike OTA 2

host:
  mac_address: ${mac}

external_components:
  - source:
      type: local
      path: components

baidu_host:

logger:
  level: DEBUG

api:
  encryption: {}

ota:
  - platform: esphome
    password: !secret ota_password

mdns:

# answers mDNS with the records mdns: builds (host mdns sends nothing)
baidu_mdns:

microphone:
  - platform: baidu_mic
    id: mic

speaker:
  - platform: baidu_speaker
    id: spk

media_player:
  - platform: baidu_media_player
    id: player
    name: Media Player
    speaker: spk
    # duck the media under announcements and replies, as Voice PE
    on_announcement:
      - baidu_speaker.apply_ducking:
          id: spk
          decibel_reduction: 20
    on_state:
      - if:
          condition:
            not:
              media_player.is_announcing: player
          then:
            - baidu_speaker.apply_ducking:
                id: spk
                decibel_reduction: 0
                duration: 1s

binary_sensor:
  - platform: evdev
    id: key_mute
    name: Mute Key
    key: KEY_MUTE
  - platform: evdev
    id: key_volume_down
    name: Volume Down Key
    key: KEY_VOLUMEDOWN
  - platform: evdev
    id: key_volume_up
    name: Volume Up Key
    key: KEY_VOLUMEUP
  - platform: evdev
    id: key_play_pause
    name: Play/Pause Key
    key: KEY_PLAYPAUSE
    # TEST: check ESPHome's click timing on the keypad (replaced in step 3)
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at most 0.4s
          - ON for at most 1s
          - OFF for at least 0.4s
        then:
          - logger.log: "Play/Pause: double click"
      - timing:
          - ON for 1s to 5s
          - OFF for at least 0.1s
        then:
          - logger.log: "Play/Pause: long press"
      - timing:
          - ON for at most 1s
          - OFF for at least 0.4s
        then:
          - logger.log: "Play/Pause: single click"

light:
  - platform: baidu_leds
    id: led_ring
    name: LED Ring
    default_transition_length: 0s
    effects:
      - addressable_rainbow:
      - addressable_twinkle:
      - addressable_scan:
          move_interval: 80ms
      - pulse:

micro_wake_word:
  id: mww
  microphone: mic
  models:
    - model: okay_nabu
    - model: hey_jarvis
    - model: hey_mycroft
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: mic
  media_player: player
  # lists the models in HA, which picks the active one
  micro_wake_word: mww
  on_client_connected:
    - micro_wake_word.start:
  on_client_disconnected:
    - micro_wake_word.stop:
  # listen for the wake word again once the session is over
  on_end:
    - wait_until:
        not:
          voice_assistant.is_running:
    - micro_wake_word.start:
