# Read at boot by /opt/baidu/bin/dcslaunch.sh (installed as /opt/baidu/etc/launcher.conf;
# install.sh keeps an existing copy).
#
# true: reload the WiFi driver as an 802.11b-only client (~4 Mbps, steady).
# false: the stock b/g/n mode (faster at best, but on some networks it stalls
# and gets deauthenticated). Missing means true.
legacy_rates=true
