[general]

# connection retry interval (ms)
#retry_interval=3000
#connect_timeout=5000

[audio]
output=hw:audiocodec
input=hw:audiocodec
volume=LINEOUT volume
# average MIC1/MIC2 into mono (required for ec)
stereo2mono=true

[ec]
enabled=true
# capture 3 channels; channel 3 is the hardware speaker reference
loopback=true

[sound]
# WAV, FLAC or MP3; relative to esphome sound_dir; empty disables.
# Defaults are the HA Voice PE sounds in share/sounds.
wake=wake_word_triggered.flac
# Assist timer finished (repeats until PLAYPAUSE, the wake word or "stop")
alarm_clock_elapsed=timer_finished.flac
mute_on=mute_switch_on.flac
mute_off=mute_switch_off.flac
# PLAYPAUSE double, triple and long press (also HA "Button press" events)
button_double=center_button_double_press.flac
button_triple=center_button_triple_press.flac
button_long=center_button_long_press.flac

[esphome]
# empty: xiaodu-<last 6 MAC hex digits>
name=
port=6053
# base64 Noise PSK from HA; leave empty for plaintext
encryption_key=
model_dir=/opt/ss/share/models
sound_dir=/opt/ss/share/sounds

[wakeword]
# set from HA (the satellite's wake word and sensitivity) and saved here
# model id in model_dir: okay_nabu, hey_jarvis, hey_mycroft
active=okay_nabu
# Slightly sensitive, Moderately sensitive, Very sensitive
sensitivity=Slightly sensitive

[buttons]
enabled=true
evinput_dev=/dev/input/event0

[leds]
# By default, leds are not enabled
enabled=true
type=aw
#path=/sys/class/leds/aw21036_led
path=/sys/class/leds/isled01

# The "LED ring" light in HA (saved here when changed there): the idle
# color when on, and the accent color of the listening, thinking, replying
# and timer animations (Satellite1 led_ring.yaml)
ring=false
ring_color=17bbf2
ring_brightness=0.66
