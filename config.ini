[general]

# connection retry interval (ms)
#retry_interval=3000
#connect_timeout=5000

[audio]
# alsa (stock units) or pulse (Genie units)
backend=alsa
output=hw:audiocodec
input=hw:audiocodec
volume=LINEOUT volume
# average MIC1/MIC2 into mono (required for ec)
#stereo2mono=false

[ec]
#enabled=false
# capture 3 channels; channel 3 is the hardware speaker reference
#loopback=false

[esphome]
name=xiaodu-speaker
port=6053
# base64 Noise PSK from HA; leave empty for plaintext
encryption_key=
model_dir=/opt/ss/share/models
sound_dir=/opt/ss/share/sounds

[buttons]
enabled=true
evinput_dev=/dev/input/event0

[leds]
# By default, leds are not enabled
enabled=true
type=aw
#path=/sys/class/leds/aw21036_led
path=/sys/class/leds/isled01

# 0: Starting
starting_effect=pulse
starting_color=0000ff

# 1: Sleeping
sleeping_effect=none
sleeping_color=000000

# 2: Listening
listening_effect=pulse
listening_color=ffffff

# 3: Processing
processing_effect=circular
processing_color=ff0000

# 4: Saying
saying_effect=pulse
saying_color=00ff00

# 5: Config
config_effect=solid
config_color=ff00ff

# 6: Error
error_effect=pulse
error_color=00ffff

# 7: Net Error
net_error_effect=circular
net_error_color=ffa500

# 8: Disabled
disabled_effect=solid
disabled_color=00ffff
