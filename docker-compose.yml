# Home Assistant Voice (Remote) Services
services:
  WhisperService:
    image: rhasspy/wyoming-whisper
    ports:
      - "10300:10300"
    volumes:
      - /home/jdn/Data2/WhisperData:/data
    command:
      - "--model"
      - "medium"
      - "--language"
      - "en"
      # Uncomment the next two lines to enable CUDA device support
      #- "--device"
      #- "cuda"
    restart: unless-stopped
  PiperService:
    image: rhasspy/wyoming-piper
    ports:
      - "10200:10200"
    volumes:
      - /home/jdn/Data2/PiperData:/data
    command:
      - "--voice"
      - "en_US-lessac-medium"
    restart: unless-stopped
